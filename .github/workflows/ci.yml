name: GradeOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend Lint & Health Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System C-Libraries for PyMuPDF & Graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 \
            libfontconfig1 \
            libxrender1 \
            libxext6

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Core Backend Imports & Syntax
        run: |
          python -c "import fastapi, pymupdf, motor, pydantic; print('All core backend modules loaded cleanly!')"

  frontend-checks:
    name: Frontend Vite Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Test Production Build (Vite)
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://gradeops-kmmz.onrender.com
        run: npm run build
