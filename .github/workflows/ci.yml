name: GradeOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Backend CI & Docker Verification (Render Deployment Pre-Flight)
  # =========================================================================
  backend-ci:
    name: Backend CI & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Debian Shared Libraries (PyMuPDF & Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0 libfontconfig1 libxrender1 libxext6 build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Validate Core Module Imports & Syntax
        run: |
          python -c "import fastapi, pymupdf, motor, pydantic; print('✅ Core dependencies OK')"
          python -m py_compile backend/main.py backend/core/security.py backend/services/attendance_service.py backend/ml_pipeline/grading/engine.py

      - name: Run Test Suite (Pytest)
        run: |
          if [ -d "backend/tests" ]; then
            pytest backend/tests/ -v
          else
            echo "ℹ️ No test suite in backend/tests/ yet. Skipping unit tests."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Container Build Pre-Flight Check
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gradeops-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 2: Frontend CI & Production Build (Vercel Deployment Pre-Flight)
  # =========================================================================
  frontend-ci:
    name: Frontend CI & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Production Vite SPA Build
        run: |
          cd frontend
          VITE_API_BASE_URL=https://dummy-api.gradeops.internal npm run build

  # =========================================================================
  # JOB 3: Deployment Verification & Status Signal
  # =========================================================================
  deployment-status:
    name: Cloud CD Verification (Render & Vercel)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Log Deployment Confirmation
        run: |
          echo "================================================================="
          echo "🎉 All CI checks passed for main branch!"
          echo "🚀 Render: Automated Docker Webhook Triggered for Backend API"
          echo "⚡ Vercel: Automated Git Integration Triggered for Frontend SPA"
          echo "================================================================="
